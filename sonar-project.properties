sonar.projectKey=batingeers-stats-service
sonar.projectName=Batingeers Stats Service
sonar.projectVersion=1.0.0

# Código fuente
sonar.sources=app
sonar.tests=tests

# Lenguaje
sonar.language=py

# Exclusiones
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/migrations/**

# Cobertura — generado por pytest-cov con formato XML
sonar.python.coverage.reportPaths=coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8
